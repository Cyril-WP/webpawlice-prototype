# PROTOTYPE — daily look-alike watch. Opens an issue when a new look-alike of a watched domain is registered.
name: Look-alike watch

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: lookalike-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check look-alikes
        run: node watch/watch.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Open an issue for new look-alikes
        if: hashFiles('watch/alert.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "New look-alike domains $(date -u +%F)" --body-file watch/alert.md

      - name: Save what was seen
        run: |
          git config user.name "webpawlice-watch"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add watch/state.json
          git diff --cached --quiet || git commit -m "Record look-alike watch results"
          git push
